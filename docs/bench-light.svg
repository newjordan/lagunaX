<text x="541.2045342533268" y="418" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">1,950</text>
<text x="32" y="446" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Control is the same GPU, model file and flags with these kernels off. Each panel has its own scale; bars start at zero.</text>
</svg>
