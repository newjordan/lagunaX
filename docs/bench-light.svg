<svg xmlns="http://www.w3.org/2000/svg" width="880" height="464" viewBox="0 0 880 464" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title id="t">lagunaB70 vs control on Intel Arc Pro B70</title>
<desc id="d">Token generation runs at 138 tokens per second versus 107 for the control build, 29 percent faster. Prompt reading is 3 to 4 percent faster at 512, 2048 and 8192 tokens.</desc>
<rect width="880" height="464" fill="#fcfcfb"/>
<text x="32" y="44" font-size="23" fill="#0b0b0b" font-weight="600" text-anchor="start">lagunaB70 vs control</text>
<text x="32" y="68" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start">Laguna-XS 2.1 (Q4_K_M) · Intel Arc Pro B70 · one request at a time · tok/s, higher is better</text>
<text x="848" y="44" font-size="13" fill="#52514e" font-weight="500" text-anchor="end">lagunaB70</text>
<rect x="766.1" y="35" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="744.1" y="44" font-size="13" fill="#52514e" font-weight="500" text-anchor="end">control</text>
<rect x="676.4" y="35" width="10" height="10" rx="2" fill="#898781"/>
<text x="32" y="112" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="start" letter-spacing="0.09em">WRITING AN ANSWER — 128 tokens generated</text>
<path d="M166 126 H503.4450867052023 A4 4 0 0 1 507.4450867052023 130 V156 A4 4 0 0 1 503.4450867052023 160 H166 Z" fill="#898781"/>
<text x="150" y="148" font-size="14" fill="#52514e" font-weight="400" text-anchor="end">control</text>
<text x="521.4450867052024" y="150" font-size="21" fill="#0b0b0b" font-weight="600" text-anchor="start">107</text>
<text x="560.4450867052024" y="150" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">tok/s</text>
<path d="M166 172 H602.0 A4 4 0 0 1 606.0 176 V202 A4 4 0 0 1 602.0 206 H166 Z" fill="#2a78d6"/>
<text x="150" y="194" font-size="14" fill="#52514e" font-weight="600" text-anchor="end">lagunaB70</text>
<text x="620.0" y="196" font-size="21" fill="#0b0b0b" font-weight="600" text-anchor="start">138</text>
<text x="659.0" y="196" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">tok/s</text>
<text x="848" y="197" font-size="17" fill="#006300" font-weight="700" text-anchor="end">+29% vs control</text>
<line x1="32" y1="242" x2="848" y2="242" stroke="#e1e0d9" stroke-width="1"/>
<text x="32" y="272" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="start" letter-spacing="0.09em">READING A PROMPT — by prompt length, separate scale</text>
<text x="150" y="310" font-size="13" fill="#52514e" font-weight="400" text-anchor="end">512 tok</text>
<path d="M166 290 H375.31690487925084 A4 4 0 0 1 379.31690487925084 294 V299 A4 4 0 0 1 375.31690487925084 303 H166 Z" fill="#898781"/>
<text x="389.31690487925084" y="301" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">1,139</text>
<path d="M166 307 H381.68457368161654 A4 4 0 0 1 385.68457368161654 311 V316 A4 4 0 0 1 381.68457368161654 320 H166 Z" fill="#2a78d6"/>
<text x="395.68457368161654" y="318" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">1,173</text>
<text x="150" y="360" font-size="13" fill="#52514e" font-weight="400" text-anchor="end">2048 tok</text>
<path d="M166 340 H527.9536717594874 A4 4 0 0 1 531.9536717594874 344 V349 A4 4 0 0 1 527.9536717594874 353 H166 Z" fill="#898781"/>
<text x="541.9536717594874" y="351" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">1,954</text>
<path d="M166 357 H542.0 A4 4 0 0 1 546.0 361 V366 A4 4 0 0 1 542.0 370 H166 Z" fill="#2a78d6"/>
<text x="556.0" y="368" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">2,029</text>
<text x="150" y="410" font-size="13" fill="#52514e" font-weight="400" text-anchor="end">8192 tok</text>
<path d="M166 390 H514.094627895515 A4 4 0 0 1 518.094627895515 394 V399 A4 4 0 0 1 514.094627895515 403 H166 Z" fill="#898781"/>
<text x="528.094627895515" y="401" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">1,880</text>
